<!doctype html>
<!--
  index.html — the single HTML page of the TripWise SPA.
  React renders everything inside <div id="root">; this file only holds
  meta tags, the favicon, and a tiny pre-paint theme script.
-->
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- Icons: the gateway mark in the tab, and on phone home screens. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Plan trips across India’s seven worlds with AI and real places — day-by-day plans that fit your budget, guides for 88 Indian destinations, and group trips with friends. Free."
    />
    <meta name="theme-color" content="#f6efe3" />
    <title>TripWise — Wander wisely</title>
    <!-- Link previews (WhatsApp, X, Facebook…); pages built for search replace these with their own. -->
    <meta property="og:site_name" content="TripWise" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TripWise — Wander wisely" />
    <meta property="og:description" content="Free AI trip plans, real places and guides for 88 destinations across India’s seven worlds." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Set the theme BEFORE the first paint so dark-mode users never see a white flash.
      Must stay in sync with ThemeProvider (storage key "tw_theme").
      Wrapped in try/catch because localStorage can be blocked (private mode).
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('tw_theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          // Calm motion (Passport setting, key "tw_motion" — see src/lib/motionPreference.ts)
          if (localStorage.getItem('tw_motion') === 'calm') document.documentElement.dataset.motion = 'calm';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
